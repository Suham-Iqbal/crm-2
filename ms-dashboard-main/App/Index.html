<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams CRM</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

  <div class="toast-container position-fixed top-0 end-0 p-3"></div>

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bolder text-primary" href="#">CRM</a>
      <div class="d-flex w-50 mx-auto">
        <input class="form-control me-2" id="searchInput" type="search" placeholder="Search sections" aria-label="Search">
      </div>
      <div class="d-flex align-items-center">
       
        <button id="theme-toggle" class="btn btn-outline-light btn-sm me-3">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        
        <div class="dropdown">
          <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <span id="userName" class="fw-bold">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-sliders me-2"></i>Preferences</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button id="logoutBtn" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div id="app-container" class="d-flex" style="height: calc(100vh - 56px);">
  
    <aside id="miniSidebar" class="bg-white text-white p-2 d-flex flex-column align-items-center" style="width: 60px;">
   
    </aside>

    <aside id="subSidebar" class="bg-light border-end p-3" style="width: 250px; min-width: 150px; max-width: 500px;">
      <h6 class="fw-bold mb-3 p-2 text-dark">Select a Module</h6>
      <ul id="subList" class="list-group list-group-flush"></ul>
    </aside>

    <div id="dragHandle" class="drag-handle"></div>

    <main id="mainContent" class="flex-grow-1 bg-white">
      <div class="d-flex justify-content-between align-items-center border-bottom p-3 bg-light">
        <button id="expandBtn" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-arrows-fullscreen"></i>
        </button>
        <h5 id="mainContentHeader" class="mb-0 fw-semibold text-dark">CRM Dashboard</h5>
      </div>
      <div id="dataDisplay" class="p-4">

        <div id="generalChatContainer" class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-input-form" id="chat-form">
            <input type="text" id="chat-input" class="form-control" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="btn btn-primary ms-2"><i class="bi bi-send-fill"></i></button>
          </form>
        </div>

        <div id="privateChatContainer" class="private-chat-container" style="display: none;">
          <div class="d-flex align-items-center mb-2">
            <i class="bi bi-person-circle fs-3 me-2"></i>
            <h5 class="mb-0" id="privateChatHeader"></h5>
          </div>
          <div class="private-chat-messages" id="private-chat-messages" style="height: 250px; overflow-y: auto;"></div>
          <form id="private-chat-form" class="d-flex">
            <input type="text" id="private-chat-input" class="form-control me-2" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill"></i></button>
          </form>
          <button class="btn btn-link mt-2" id="back-to-users">&larr; Back to Users</button>
        </div>

        <div id="activitySection">
          <h5 class="fw-semibold text-dark">Activity Log</h5>
          <form id="addActivityForm" class="mb-3 d-flex">
            <input type="text" id="activityInput" class="form-control me-2" placeholder="Add an activity..." required>
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
          <ul id="activityList" class="list-group"></ul>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="userManagementModal" tabindex="-1" aria-labelledby="userManagementModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userManagementModalLabel">User Management</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="userManagementModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
